name: Checks

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.2.0
        with:
          install: true
          cache: true
          fetch_from_github: false
          minimum_release_age: ""
      - run: mise run check
